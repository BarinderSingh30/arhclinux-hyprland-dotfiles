# hypridle -- idle management
#
# Timeouts here are deliberately LONGER than upstream's example. That example
# targets a battery-powered laptop and dims at 2.5 minutes. This machine is
# permanently plugged in with a battery at 24.6% health, so power saving buys
# nothing and a screen that dims while you are reading is a real annoyance.
# Optimizing for uninterrupted work instead.
#
# Timeline:
#    5 min  dim the backlight   (instantly reversible, no session change)
#   10 min  lock
#   10.5 min  displays off
#   never   suspend
#
# No suspend listener on purpose: always on AC, and a suspend/resume cycle on
# this Intel graphics stack is a risk with no upside here. Lid-close suspend
# is still handled by logind, and before_sleep_cmd below locks first.
#
# No keyboard-backlight listener either. Upstream's example toggles
# "rgb:kbd_backlight", which does not exist on this machine -- `brightnessctl -l`
# lists only intel_backlight plus the capslock/numlock/scrolllock LEDs.

general {
    # `pidof` guard prevents a second hyprlock spawning on top of the first,
    # which would otherwise happen when a lock timeout fires while already
    # locked, and can leave you unable to type into either instance.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock BEFORE the machine sleeps, so it never resumes to an unlocked
    # desktop. loginctl is used rather than calling hyprlock directly so that
    # the session is properly marked locked in logind.
    before_sleep_cmd = loginctl lock-session

    # Wake the displays on resume without needing a keypress first.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 5 min -- dim only. -s saves the current level so -r restores it exactly.
listener {
    timeout   = 300
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 10 min -- lock.
listener {
    timeout   = 600
    on-timeout = loginctl lock-session
}

# 10.5 min -- displays off. Kept 30s after the lock so the lock screen is
# already up underneath; blanking first would show the desktop for a moment
# on the next mouse move.
listener {
    timeout   = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
