# kitty 0.48 -- everything except colors.
#
# Colors live in ~/.config/theme/kitty.conf, generated by `theme-set`. The
# include is at the BOTTOM: kitty applies options in file order, so pulling
# the palette in last lets it win over anything above it.

# --- Font -----------------------------------------------------------------
# JetBrainsMono Nerd Font is installed and fc-match resolves it exactly.
# Nerd Font glyphs matter here because the prompt (Phase 5) uses them.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# eDP-1 runs at 1.25x. kitty renders at the fractional scale natively, so no
# manual DPI fudging is needed -- but disable ligatures under the cursor so
# editing inside an `=>` or `!=` stays legible.
disable_ligatures cursor

# --- Cursor ---------------------------------------------------------------
cursor_shape           block
cursor_blink_interval  0
shell_integration      no-cursor

# --- Scrollback -----------------------------------------------------------
scrollback_lines            10000
scrollback_pager_history_size 0

# --- Mouse ----------------------------------------------------------------
mouse_hide_wait      2.0
copy_on_select       no
strip_trailing_spaces smart
url_style            curly
detect_urls          yes

# --- Performance ----------------------------------------------------------
# 7.4 GB RAM and an Iris G1: keep the render loop cheap. 10ms input delay is
# imperceptible while cutting redundant redraws during fast output.
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# --- Bell -----------------------------------------------------------------
enable_audio_bell    no
visual_bell_duration 0
window_alert_on_bell yes

# --- Window ---------------------------------------------------------------
# rounding = 0 everywhere in this rice; kitty has no rounding of its own, but
# it does draw padding and borders.
remember_window_size  no
window_padding_width  8
window_border_width   0
hide_window_decorations yes
confirm_os_window_close 0

# Hyprland's `enable_swallow` matches on class ^(kitty)$ -- don't change it.
# linux_display_server auto keeps the Wayland backend, which is what the
# swallow regex and window rules assume.
linux_display_server auto

# --- Tabs -----------------------------------------------------------------
# Hyprland does the window management; kitty tabs are for quick splits only.
tab_bar_edge      top
tab_bar_style     powerline
tab_powerline_style angled
tab_bar_min_tabs  2

# --- Keys -----------------------------------------------------------------
# Deliberately sparse. SUPER is Hyprland's; kitty stays on CTRL+SHIFT so the
# two never fight over a chord.
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0

# --- Colors (generated -- keep last) --------------------------------------
include ~/.config/theme/kitty.conf
