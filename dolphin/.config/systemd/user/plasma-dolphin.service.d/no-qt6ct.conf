# Drop-in for /usr/lib/systemd/user/plasma-dolphin.service.
#
# Same purpose as ~/.local/share/applications/org.kde.dolphin.desktop: keep
# Dolphin at its stock appearance, opted out of the qt6ct rice.
#
# Why a second file is needed. The .desktop override only covers launches
# that read a .desktop file (rofi, "Open With"). The OTHER way Dolphin starts
# is D-Bus activation of org.freedesktop.FileManager1 -- what "Show in folder"
# in Firefox and friends calls. That request is handed to systemd, because
# /usr/share/dbus-1/services/org.kde.dolphin.FileManager1.service declares
# SystemdService=plasma-dolphin.service, and the unit then inherits the
# systemd --user activation environment, which carries
# QT_QPA_PLATFORMTHEME=qt6ct (confirmed via `systemctl --user show-environment`).
# Without this drop-in, that route would still start a themed Dolphin.
#
# To undo: delete this file, then run `systemctl --user daemon-reload`.

[Service]
UnsetEnvironment=QT_QPA_PLATFORMTHEME
