# Stop HDMI audio outputs from stealing the default sink.
#
# The analog sink's only port is [Out] Headphones, which reports "not
# available" whenever the 3.5mm jack is empty -- even though the laptop
# speakers sit on the same PCM and work. WirePlumber skips unavailable
# nodes when picking a default, so it fell through to HDMI1 and played to
# a monitor with no speakers. Lowering priority does NOT help: availability
# is checked before priority. Disabling the HDMI sink nodes leaves the
# built-in output as the only wired choice, so it wins when no Bluetooth
# device is connected.
#
# Delete this file and restart wireplumber to get HDMI audio back.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__HDMI[0-9]+__sink" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
