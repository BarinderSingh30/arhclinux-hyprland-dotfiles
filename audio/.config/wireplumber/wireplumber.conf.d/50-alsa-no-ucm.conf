# Bypass UCM on the built-in sof-hda-dsp card.
#
# With UCM (the default) the card's analog sink gets exactly one port,
# [Out] Headphones, whose availability follows the 3.5mm jack. With nothing
# plugged in it reads "not available", so WirePlumber refuses to treat the
# sink as a valid default target -- `wpctl status` shows no '*' beside it.
# The laptop speakers are never exposed as a port at all, because UCM defines
# Speaker and Headphones on the same PCM ("hw:${CardId}") and PipeWire keeps
# only the higher-priority one (Headphones 200 > Speaker 100).
#
# Consequence, measured 2026-08-18: disconnecting Bluetooth left the machine
# with zero valid default sinks, so the playing stream was destroyed instead
# of moved and the laptop went silent until the app was restarted.
#
# Without UCM, ACP builds the classic analog profile:
#   analog-output-speaker    priority 10000  availability unknown  <- always usable
#   analog-output-headphones priority  9900  follows the jack
# The sink becomes a valid default target, so audio falls back to the speakers
# automatically when Bluetooth goes away, and ACP drives the mixer itself.
#
# Two costs, both accepted deliberately:
#   - the HDMI audio outputs disappear (this display has no speakers)
#   - the digital mic array is not exposed; only UCM maps those PCMs, so the
#     built-in microphone stops working. The Bluetooth headset mic still does.
#
# Delete this file and restart wireplumber to go back to UCM.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
      }
    }
  }
]
